services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: legal_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/legal_assistant
      DATA_DIR: /app/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      REQUIRE_IDENTITY_HEADERS: ${REQUIRE_IDENTITY_HEADERS:-false}
    volumes:
      - legal_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
  legal_data:
